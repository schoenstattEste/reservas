/* Ventana de confirmación propia (la del navegador siempre muestra el nombre del sitio como título) */
function ask(question, lines, okText, noText, danger) {

// Indicador de espera: bloquea toques repetidos y muestra una animación mientras se procesa la gestión.
// El aviso aparece con un ligero retraso (así no parpadea en acciones rápidas), pero el bloqueo es inmediato.
const busyOn = t => { S.busy = true; $('#busyt').textContent = t; $('#busy').hidden = false; };
const busyText = t => { if (S.busy) $('#busyt').textContent = t; };
const busyOff = () => { S.busy = false; $('#busy').hidden = true; };

const guard = (t, f) => async (...a) => {
  a[0]?.preventDefault?.();

  busyOn(t);
  try { return await f(...a); } finally { busyOff(); }
};
const MES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

const when = (a, b) => dia(a) === dia(b) ? ['Fecha: ' + dia(a), 'Horario: ' + hora(a) + ' a ' + hora(b)] : ['Desde: ' + dia(a) + ', ' + hora(a), 'Hasta: ' + dia(b) + ', ' + hora(b)];

async function loadAssign(box) {

  const keep = new Set([...box.querySelectorAll('input:checked')].map(x => x.value));

async function submit(e) {

  if (evn > EVMAX) return msg('El nombre del evento admite máximo ' + EVMAX + ' caracteres.', 1);
  if (!S.admin && !S.edit && $('[name=kind]') && !$('[name=kind]:checked')) return msg('Elija el tipo de actividad: actividad de grupos o evento privado.', 1);
  const kind = S.edit ? S.edit.kind : ($('[name=kind]:checked')?.value || 'group'), noRooms = kind === 'private' && !S.admin;
  S.kind = kind;

  const ids = [...document.querySelectorAll('[name=sp]:checked')].map(x => x.value);

  const ed = S.edit, editAppr = ed?.status === 'approved';
  const rooms = bld ? S.spaces.filter(s => s.active && s.kind === 'room' && s.building_id === bld.id) : [];
  const repeating = !!$('#rp')?.checked; // en una serie, las fechas con choque se omiten (se revisan una por una)
  const cal = repeating ? null : await calendarBusy(a, b, ed?.id); // revisión final por si alguien reservó mientras tanto
  if (cal && [...ids, ...rooms.map(s => s.id), ...(bld ? [bld.id] : [])].some(i => cal[i])) return msg('Alguno de los espacios ya tiene una reserva en ese horario. Vuelva a elegir.', 1);
  const chosen = S.spaces.filter(s => ids.includes(s.id));
  if (S.admin && !ed) return adminSubmit({a, b, ids, bld, chosen, kind, details: $('#dtl')?.value.trim() || ''});
  const auto = !bld && chosen.every(s => s.requires_approval === false);
  let q, okTxt, extra = [];

  else if (auto) { q = '¿Desea confirmar la reserva?'; okTxt = 'Confirmar reserva'; extra = ['Se aprueba automáticamente.']; }
  else { q = '¿Desea enviar la solicitud de reserva?'; okTxt = 'Enviar solicitud'; extra = [...(bld ? ['Incluye todas las salas de ' + bld.name + '.'] : []), 'Requiere aprobación de la administración.']; }
  const ok = await ask(q, [...(bld ? [bld.name + ' completa'] : []), ...chosen.map(spaceLine), ...when(a, b), ...extra], okTxt, 'Volver');
  if (!ok) return;
  busyText(ed ? 'Guardando los cambios…' : auto ? 'Confirmando su reserva…' : 'Enviando su solicitud…');
  const pf = {user_id: S.user.id, email: S.user.email, full_name: $('#nm').value.trim(), phone: $('#ph').value.trim(), updated_at: new Date().toISOString()};
  let r = await sb.from('profiles').upsert(pf);

  S.profile = pf;
  const f = {p_purpose: $('#pp').value.trim(), p_attendees: +$('#at').value || null, p_start: a, p_end: b, p_space_ids: ids};
  let text;
  if (editAppr) {
    // Reserva aprobada: se revalida en base de datos y Calendar; si no se puede, se conserva la original
    r = await sb.functions.invoke('reserve', {body: {action: 'edit', reservation_id: ed.id, purpose: f.p_purpose, attendees: f.p_attendees, start: a, end: b, space_ids: ids}});
    const out = r.data;

    if (!out.ok) return msg(err({message: out.error || ''}) || 'No se pudo guardar el cambio. Se conservó la reserva original.', 1);
    sb.functions.invoke('notify', {body: {reservation_id: ed.id, event: 'edited'}}).catch(() => {});

    }
    const rid = ed ? ed.id : r.data;
    let approved = false, reason = '';
    if (auto) {

        const x = await sb.functions.invoke('reserve', {body: {action: 'auto_approve', reservation_id: rid}});
        approved = !!x.data?.approved; reason = x.data?.reason || (x.error ? 'calendar_error' : '');

      text = 'Reserva confirmada. Quedó aprobada y registrada en el calendario.';

    }

  msg(text);
  S.edit = null; S.tab = 'mine'; shell();
}

async function decide(btn, kind) {
  const card = btn.closest('.card'), id = card.dataset.id, r = S.res[id];
  if (kind === 'no' && r.status === 'approved' && !(await ask(r.series_id ? '¿Desea cancelar esta fecha de la serie?' : '¿Desea cancelar la reserva?',
    [r.requester_name + (r.purpose ? ' · ' + r.purpose : ''), names(r), rango(r), 'Se libera el espacio, se quita del calendario y se avisa por correo a la persona.', 'Esta acción no se puede deshacer.'], 'Cancelar reserva', 'Volver', 1))) return;
  const s = card.querySelector('.s') ? iso(card.querySelector('.s').value) : r.starts_at, e = card.querySelector('.e') ? iso(card.querySelector('.e').value) : r.ends_at;
  let removed = [], swapped = false, firstAssign = false;
  if (kind === 'ok') {
    const sel = [...card.querySelectorAll('.pick input:checked')].map(x => x.value);
    if (r.kind === 'private' && r.status === 'pending' && !sel.length) return msg('Elija al menos un espacio para aprobar este evento privado.', 1);
    const cur = r.reservation_items.map(i => i.space_id);
    swapped = !(sel.length === cur.length && sel.every(x => cur.includes(x)));
    firstAssign = r.kind === 'private' && !cur.length; // asignar espacios a un evento privado no es un ajuste a lo solicitado
    // Revisa Google Calendar antes de aprobar: si hay eventos en ese horario, el administrador decide
    const found = await calendarConflicts(id, s, e, sel.length ? sel : cur);
    if (found && found.length && !(await ask('En Google Calendar ya hay eventos en ese horario. ¿Desea aprobar de todos modos?', found, 'Aprobar de todos modos', 'Volver'))) return;
    if (swapped) {
      const q = await sb.rpc('change_reservation_spaces', {p_reservation: id, p_space_ids: sel});
      if (q.error) return msg(err(q.error), 1);
      removed = q.data || [];
    }
  }
  const up = {admin_note: card.querySelector('.n')?.value || null, decided_by: S.user.id, decided_at: new Date().toISOString()};
  if (kind === 'ok') {
    const changed = new Date(s) - new Date(r.starts_at) || new Date(e) - new Date(r.ends_at);
    Object.assign(up, {status: 'approved', starts_at: s, ends_at: e, was_modified: r.was_modified || !!changed || (swapped && !r.whole_building_id && !firstAssign)});
  } else up.status = r.status === 'pending' ? 'rejected' : 'cancelled';
  const {error} = await sb.from('reservations').update(up).eq('id', id);
  if (error) return msg(err(error), 1);
  const f = await sb.functions.invoke('sync-calendar', {body: {reservation_id: id, removed}});
  let d = '';
  try { const j = f.error ? await f.error.context.json() : f.data; d = (j.detail || [j.error]).filter(Boolean).join('; '); } catch (_) {}
  const n = await sb.functions.invoke('notify', {body: {reservation_id: id, event: 'decision'}});
  const mail = n.error ? ' No se pudo enviar el correo a la persona.' : ' Se avisó por correo a la persona.';
  const zonal = r.kind !== 'private' ? '' : n.data?.zonal === 'enviada' ? ' Se envió copia a la administración zonal.' : n.data?.zonal === 'sin correo' ? ' No hay correo de la administración zonal configurado (Administración > Configuración).' : (n.error || n.data?.zonal === 'error') ? ' No se pudo enviar la copia a la administración zonal.' : '';
  msg((f.error ? 'Guardado, pero Google Calendar no se actualizó: ' + d : 'Listo. ' + d) + mail + zonal, !!f.error || !!n.error || n.data?.zonal === 'error');
  adminView();
}

    description: $('#sd').value.trim() || null, active: $('#sa').checked, requires_approval: !$('#sr').checked, building_id: $('#sb').value || null};
  if (AC) Object.assign(row, {brand: isRes ? $('#sbr').value.trim() || null : null, model: isRes ? $('#smo').value.trim() || null : null, serial_number: isRes ? $('#ssn').value.trim() || null : null, asset_number: isRes ? $('#san').value.trim() || null : null});
  const r = id ? await sb.from('spaces').update(row).eq('id', id).select().single() : await sb.from('spaces').insert(row).select().single();
  if (r.error) return msg(err(r.error), 1);
  const fids = [...document.querySelectorAll('[name=ft]:checked')].map(x => +x.value), nf = $('#nf').value.trim();
  if (nf) { const f = await sb.from('features').upsert({name: nf}, {onConflict: 'name'}).select().single(); if (f.data) fids.push(f.data.id); }
  await sb.from('space_features').delete().eq('space_id', r.data.id);
  if (fids.length) await sb.from('space_features').insert([...new Set(fids)].map(f => ({space_id: r.data.id, feature_id: f})));
  await loadBase(); msg('Guardado.'); adminView();
}

/* ============ 9. ACCIONES (botones) ============ */
const acts = {
  google: () => sb.auth.signInWithOAuth({provider: 'google', options: {redirectTo: location.origin + location.pathname}}),
  out: async () => { // si la sesión quedó dañada, signOut puede fallar sin cerrar nada: se limpia el almacenamiento local y se recarga
    try { await Promise.race([sb.auth.signOut(), new Promise(r => setTimeout(r, 2500))]); } catch (_) {}
    try { Object.keys(localStorage).filter(k => /^sb-.*-auth-token/.test(k)).forEach(k => localStorage.removeItem(k)); } catch (_) {}
    location.reload();
  },
  again: () => loginView(),
  cxs: b => cancelSeries(b),
  shs: b => shiftSeries(b),
  sgo: b => { const v = b.closest('.card').querySelector('.ac').value, id = b.dataset.id;
    if (v === 'room') return decide(b, 'ok'); if (v === 'one') return decide(b, 'no');
    if (v === 'time') return shiftSeries(b); if (v === 'from') return cancelSeries({dataset: {id, mode: 'from'}, note: b.closest('.card').querySelector('.n')?.value.trim()}); },
  sub: b => { S.sub = b.dataset.s; adminView(); },
  tab: b => { S.tab = b.dataset.t; S.edit = null; shell(); },
  em: b => { S.edit = S.mine[b.dataset.id]; S.editInit = 0; S.tab = 'new'; shell(); },
  na: () => { S.showNA = !S.showNA; renderAvail(); },
  eb: b => editBuilding(b.dataset.id),
  sx: async b => {
    const x = S.spaces.find(y => y.id === b.dataset.id);
    if (!await ask('¿Desea eliminar este espacio?', [spaceLine(x), 'Se eliminan también sus bloqueos por periodo y sus características.', 'Esta acción no se puede deshacer.'], 'Eliminar', 'Volver', 1)) return;
    const r = await sb.from('spaces').delete().eq('id', b.dataset.id);
    if (r.error) return msg(/foreign key/.test(r.error.message || '')
      ? 'No se puede eliminar: tiene reservas en el historial. Deshabilítelo en "Editar" (desactive el interruptor "Habilitado") y dejará de ofrecerse.' : err(r.error), 1);
    await loadBase(); msg('Espacio eliminado.'); adminView();
  },
  bx: async b => {
    const x = S.buildings.find(y => y.id === b.dataset.id);
    if (!await ask('¿Desea eliminar el edificio?', [x?.name || ''], 'Eliminar', 'Volver', 1)) return;
    const r = await sb.from('buildings').delete().eq('id', b.dataset.id);
    if (r.error) return msg(err(r.error), 1);
    await loadBase(); msg('Edificio eliminado.'); adminView();
  },
  ok: b => decide(b, 'ok'),
  no: b => decide(b, 'no'),
  ed: b => editSpace(b.dataset.id),
  cx: async b => {
    const id = b.dataset.id;
    const m = S.mine[id];
    const ok = await ask('¿Desea cancelar la reserva?',
      [...m.reservation_items.map(i => spaceLine(S.spaces.find(s => s.id === i.space_id))), ...when(m.starts_at, m.ends_at), 'El espacio quedará libre para otras personas.'],
      'Sí, cancelar reserva', 'Volver', 1);
    if (!ok) return;
    const q = await sb.rpc('cancel_my_reservation', {p_reservation: id});
    if (q.error) return msg(err(q.error), 1);
    const f = await sb.functions.invoke('sync-calendar', {body: {reservation_id: id}}); // quita el evento del calendario
    sb.functions.invoke('notify', {body: {reservation_id: id, event: 'cancelled'}}).catch(() => {}); // avisa a la administración
    msg(f.error ? 'Reserva cancelada. Avise a la administración para que quite el evento del calendario.' : 'Reserva cancelada. El espacio quedó libre.', !!f.error);
    mineView();
  },
  bo: async () => {
    const s = $('#bs').value, a = $('#b1').value, b = $('#b2').value;
    if (!s || !a || !b) return msg('Complete el espacio y las fechas.', 1);
    if (iso(b) <= iso(a)) return msg('La fecha final debe ser posterior a la inicial.', 1);
    const reason = $('#br').value || null;
    let rows;
    if (s.startsWith('b:')) { // edificio completo: un bloqueo por cada sala activa, unidos por el mismo grupo
      const bid = s.slice(2), g = uuid();
      rows = S.spaces.filter(x => x.active && x.kind === 'room' && x.building_id === bid)
        .map(x => ({space_id: x.id, starts_at: iso(a), ends_at: iso(b), reason, group_id: g, building_id: bid}));
      if (!rows.length) return msg('Ese edificio no tiene salas habilitadas.', 1);
    } else rows = [{space_id: s, starts_at: iso(a), ends_at: iso(b), reason}];
    const {error} = await sb.from('blackouts').insert(rows);
    error ? msg(err(error), 1) : adminView();
  },
  bd: async b => {
    const row = b.closest('.row');
    if (!await ask('¿Desea quitar este bloqueo?', [row.querySelector('b').textContent, row.querySelector('small').textContent.trim(), ...(b.dataset.g ? ['Se quitan los bloqueos de todas las salas del edificio.'] : []), 'El espacio volverá a estar disponible en ese periodo.'], 'Quitar bloqueo', 'Volver', 1)) return;
    await (b.dataset.g ? sb.from('blackouts').delete().eq('group_id', b.dataset.g) : sb.from('blackouts').delete().eq('id', b.dataset.id)); adminView(); }
};
const BUSYTXT = {google: 'Abriendo Google…', ok: 'Guardando…', no: 'Guardando…', cx: 'Cancelando la reserva…', sx: 'Eliminando…', bx: 'Eliminando…', bo: 'Guardando el bloqueo…', bd: 'Quitando el bloqueo…', cxs: 'Cancelando…', sgo: 'Guardando…', shs: 'Cambiando el horario…'};
const ACCION = {room: ['Guardar cambios', 0], time: ['Cambiar hora…', 0], one: ['Cancelar esta fecha', 1], from: ['Cancelar esta y las siguientes', 1]};
document.addEventListener('change', e => {
  const sel = e.target.closest?.('select.ac'); if (!sel) return;
  const c = sel.closest('.card'), v = sel.value, go = c.querySelector('.go'), a = ACCION[v];
  c.querySelectorAll('.ap').forEach(x => { x.hidden = !(v && x.dataset.p.split(' ').includes(v)); });
  go.disabled = !a; go.textContent = a ? a[0] : 'Elegir una acción'; go.classList.toggle('wn', !!a && !!a[1]);
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const f = acts[b.dataset.act], t = BUSYTXT[b.dataset.act];
  if (f) (t ? guard(t, f) : f)(b);
});
</script>
</body>
