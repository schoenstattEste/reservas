<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reserva de salas y recursos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&display=swap">
<style>
/* Colores de la organización: azul del logo (--ac), dorado del sitio web (--gold). Cambiar aquí si hace falta. */
:root{color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--ink:#1c2630;--mut:#5d6b78;--line:#d8dee4;--ac:#010066;--acink:#fff;--gold:#f8b732;--ok:#1f7a4d;--bad:#b3402f;--warn:#9a6a00;--serif:'Playfair Display',Georgia,'Times New Roman',serif}
@media(prefers-color-scheme:dark){:root{--bg:#141a20;--card:#1d252d;--ink:#e6ebf0;--mut:#9aa8b5;--line:#33404c;--ac:#f8b732;--acink:#010066;--ok:#5cc08a;--bad:#e8806e;--warn:#e0b04a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-family:var(--serif);font-size:1.3rem;margin:0}h2{font-size:1.15rem;margin:0 0 8px}h3{font-size:1rem;margin:16px 0 6px}
nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
nav button{background:none;color:var(--ink);border:1px solid var(--line)}nav button.on{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font-size:.9rem;color:var(--mut);margin-bottom:8px}
input,select,textarea{display:block;width:100%;margin-top:2px;padding:8px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
input[type=checkbox]{display:inline-block;width:auto;margin:0 6px 0 0}
button{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid var(--ac);background:var(--ac);color:var(--acink);cursor:pointer}
button.sec{background:none;color:var(--ink);border-color:var(--line)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink);font-size:1rem}
.row:last-child{border:0}.row .tag{margin-left:auto}
.tag{font-size:.82rem;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.available,.approved{color:var(--ok)}.booked,.blackout,.inactive,.calendar_busy,.rejected,.cancelled{color:var(--bad)}.row.off{opacity:.6}.row.off .tag{color:var(--mut)}.pending{color:var(--warn)}.expired{color:var(--mut)}
.chip{display:inline-block;margin-right:12px}details{margin:6px 0 12px}summary{cursor:pointer;color:var(--ac)}.pick{padding:8px 0}small,.muted{color:var(--mut)}
dialog{font:inherit;border:1px solid var(--line);border-radius:10px;padding:20px;width:min(420px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}dialog h3{margin:0 0 12px;font-size:1.1rem}.dl{margin-bottom:18px;line-height:1.6}.da{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#msg{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);max-width:92%;padding:10px 16px;border-radius:8px;color:#fff;z-index:9}
#msg.ok{background:var(--ok)}#msg.bad{background:var(--bad)}
/* Pantalla de entrada */
.login{max-width:440px;margin:20px auto;padding:22px;border-top:5px solid var(--gold)}
.brand{text-align:center;margin-bottom:8px}.brand img{display:block;width:96px;height:96px;object-fit:contain;margin:0 auto 10px}
.brand h1{font-size:1.6rem;line-height:1.25}.brand p{margin:8px 0 0}
.login h3{margin:18px 0 8px}.login .wide{width:100%}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);margin:20px 0 4px}.or:before,.or:after{content:"";flex:1;border-top:1px solid var(--line)}
.help{text-align:center;margin:20px 0 0;font-size:.9rem}.help a{color:var(--ac)}
.logo-sm{width:32px;height:32px;object-fit:contain;vertical-align:middle;margin-right:8px}
@media(prefers-color-scheme:dark){.brand img,.logo-sm{background:#fff;border-radius:12px;padding:4px}}
</style>
</head>
<body>
<main id="app">Cargando…</main>
<div id="msg" role="status" hidden></div>
<script>
/* ============ 1. CONFIGURACIÓN (lo único que debe editar para empezar) ============ */
const SUPABASE_URL = 'https://zwypvyhxyvpkmlkwimyx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_UGXL0ookgPQXW5guuHMwbA_a6qi_ECZ';
  
/* ============ 2. TEXTOS (se pueden cambiar sin riesgo) ============ */
const TITLE = 'Reserva de salas y recursos';
const LOGO_URL = 'logo.png'; // archivo subido junto a index.html, o una dirección completa (https://...). Vacío = sin logo
const DESCRIPTION = 'Solicite aquí las salas y recursos de la Casa Sede Este. Su solicitud será revisada por la administración.'; // vacío = no se muestra
const SENDER_NAME = 'Reservas Casa Sede Este'; // nombre con que llegan los correos (el mismo del remitente en Supabase)
const HELP_EMAIL = 'reservascasasedeeste@gmail.com'; // vacío = no se muestra la línea de ayuda
document.title = TITLE;
if (LOGO_URL) { const ic = document.createElement('link'); ic.rel = 'icon'; ic.href = LOGO_URL; document.head.appendChild(ic); }
const LBL = {available:'Disponible', booked:'No disponible', blackout:'No disponible', calendar_busy:'No disponible', inactive:'Deshabilitado', expired:'Sin respuesta',
  pending:'Pendiente', approved:'Aprobada', rejected:'Rechazada', cancelled:'Cancelada'};
const ERR = {invalid_time:'El horario no es válido o ya pasó.', no_spaces:'Elija al menos una sala o recurso.',
  profile_incomplete:'Complete su nombre y teléfono.', too_many_pending:'Tiene demasiadas solicitudes pendientes.',
  unavailable:'Alguno de los espacios ya no está disponible en ese horario.', not_authenticated:'Inicie sesión.',
  exclusion:'Ese horario choca con otra reserva aprobada.',
  not_cancellable:'Esta reserva ya no se puede cancelar.', not_editable:'Esta reserva ya no se puede editar.', already_past:'Esa reserva ya pasó.', not_found:'No se encontró la reserva.',
  too_far:'Solo se puede reservar con un máximo de 90 días de anticipación.',
  edit_too_late:'Faltan menos de 24 horas para la reserva: solo se puede cancelar.',
  space_locked:'La administración asignó la sala de esta reserva: puede cambiar la fecha y la hora, pero no la sala.',
  edit_needs_admin:'Para cambiar esta reserva, comuníquese con la administración o cancélela.',
  new_space_needs_approval:'Ese espacio requiere aprobación: haga una solicitud nueva.',
  calendar_conflict:'Alguno de los espacios ya tiene una reserva en ese horario. Se conservó la reserva original.',
  calendar_check_failed:'No se pudo verificar el calendario. Intente de nuevo; se conservó la reserva original.',
  building_not_allowed:'Ese edificio no se puede reservar completo.', no_rooms:'El edificio no tiene salas habilitadas.',
  'violates foreign key':'No se puede eliminar: tiene salas o reservas asociadas.'};
const MAXDAYS = 90; // anticipación máxima de una reserva

/* ============ 3. UTILIDADES ============ */
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => new Date(d).toLocaleString('es', {dateStyle:'medium', timeStyle:'short'});
const loc = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0,16); };
const iso = v => new Date(v).toISOString();
const err = e => { const m = e.message || ''; const k = Object.keys(ERR).find(k => m.includes(k)); return k ? ERR[k] : m; };
/* Ventana de confirmación propia (la del navegador siempre muestra el nombre del sitio como título) */
function ask(question, lines, okText, noText) {
  return new Promise(res => {
    const d = document.createElement('dialog');
    d.innerHTML = `<form method="dialog"><h3>${esc(question)}</h3><div class="dl">${lines.map(l => `<div>${esc(l)}</div>`).join('')}</div>
      <div class="da"><button value="no" class="sec">${esc(noText || 'Volver')}</button><button value="ok">${esc(okText || 'Aceptar')}</button></div></form>`;
    d.addEventListener('close', () => { res(d.returnValue === 'ok'); d.remove(); });
    document.body.appendChild(d); d.showModal();
  });
}
const MES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const dia = d => { d = new Date(d); return d.getDate() + ' de ' + MES[d.getMonth()] + ', ' + d.getFullYear(); };
const hora = d => new Date(d).toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'}).replace(/\s?([AP])M/i, (m, x) => ' ' + x.toLowerCase() + 'm');
const when = (a, b) => dia(a) === dia(b) ? ['Fecha: ' + dia(a), 'Horario: ' + hora(a) + ' a ' + hora(b)] : ['Desde: ' + dia(a) + ', ' + hora(a), 'Hasta: ' + dia(b) + ', ' + hora(b)];
const rango = r => dia(r.starts_at) === dia(r.ends_at)
  ? dia(r.starts_at) + ' · ' + hora(r.starts_at) + ' a ' + hora(r.ends_at)
  : dia(r.starts_at) + ', ' + hora(r.starts_at) + ' a ' + dia(r.ends_at) + ', ' + hora(r.ends_at);
const spaceLine = s => (s?.kind === 'resource' ? 'Recurso ' : 'Sala ') + (s?.name || '');
const S = {tab:'new', spaces:[], buildings:[], features:[], profile:null, admin:false, user:null, res:{}};
function msg(t, bad) {
  const m = $('#msg'); m.textContent = t; m.className = bad ? 'bad' : 'ok'; m.hidden = false;
  clearTimeout(msg.t); msg.t = setTimeout(() => m.hidden = true, 6000);
}
// Edificio completo: se muestra "Casa Principal completa" en lugar de cada sala del edificio
const bOf = r => r.whole_building_id ? S.buildings.find(b => b.id === r.whole_building_id) : null;
const inB = (i, b) => b && i.spaces?.kind === 'room' && i.spaces?.building_id === b.id;
const names = r => { const b = bOf(r);
  return [...(b ? [b.name + ' completa'] : []), ...(r.reservation_items || []).filter(i => !inB(i, b)).map(i => i.spaces?.name || 'Espacio')].join(', '); };
// Salas del edificio que la administración liberó de una reserva de edificio completo
const released = r => { const b = bOf(r), cur = new Set((r.reservation_items || []).map(i => i.space_id));
  return b ? S.spaces.filter(s => s.active && s.kind === 'room' && s.building_id === b.id && !cur.has(s.id)).map(s => s.name) : []; };
const spacePicker = r => {
  const cur = new Set((r.reservation_items || []).map(i => i.space_id));
  return `<details><summary>Cambiar sala o recurso</summary><div class="pick">${S.spaces.filter(s => s.active || cur.has(s.id)).map(s =>
    `<label class="chip"><input type="checkbox" value="${s.id}" ${cur.has(s.id) ? 'checked' : ''}>${esc(s.name)}${s.capacity ? ' (' + s.capacity + ' pers.)' : ''}</label>`).join('')}</div>
    <small class="muted">Marque lo que quedará en la reserva y pulse ${r.status === 'pending' ? 'Aprobar' : 'Guardar cambios'}. El nuevo espacio debe estar libre en ese horario.</small></details>`;
};
const feats = s => { const f = (s.space_features || []).map(x => x.features.name + (x.detail ? ' ' + x.detail : '')).join(', '); return f ? ' · ' + esc(f) : ''; };

/* ============ 4. INICIO DE SESIÓN ============ */
sb.auth.onAuthStateChange((_e, s) => {
  if (!S.started || (s?.user?.id || null) !== (S.user?.id || null)) { S.started = 1; start(s); }
});

const imgTag = cls => LOGO_URL ? `<img class="${cls}" src="${esc(LOGO_URL)}" alt="" onerror="this.remove()">` : ''; // si el logo no carga, se oculta
const logoSm = () => imgTag('logo-sm');
const brand = () => `<div class="brand">${imgTag('')}<h1>${esc(TITLE)}</h1>${DESCRIPTION ? `<p class="muted">${esc(DESCRIPTION)}</p>` : ''}</div>`;
const helpLine = () => HELP_EMAIL ? `<p class="help muted">¿Necesita ayuda? Escriba a <a href="mailto:${esc(HELP_EMAIL)}">${esc(HELP_EMAIL)}</a></p>` : '';

function loginView() {
  $('#app').innerHTML = `<div class="login card">${brand()}
  <h3>¿Tiene una cuenta de Google (Gmail)?</h3>
  <button class="wide" data-act="google">Entrar con mi cuenta de Google</button>
  <div class="or"><span>o</span></div>
  <form id="lf"><h3>¿Usa otro correo (Outlook, Yahoo, institucional…)? Escríbalo aquí</h3>
  <label>Correo electrónico<input type="email" id="em" required autocomplete="email"></label>
  <button class="wide">Enviarme el enlace de acceso</button>
  <p class="muted"><small>Le llegará un correo de ${esc(SENDER_NAME)}. Ábralo y pulse el botón para entrar. No necesita contraseña.</small></p></form>
  ${helpLine()}</div>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const b = e.submitter; if (b) b.disabled = true;
    if (!(await sendLink($('#em').value.trim())) && b) b.disabled = false;
  };
}

// Envía el enlace de acceso. Si todo sale bien, muestra la pantalla de confirmación. Devuelve false si falló.
async function sendLink(email) {
  const r = await sb.auth.signInWithOtp({email, options: {emailRedirectTo: location.href.split('#')[0]}});
  if (r.error) { msg(err(r.error), 1); return false; }
  sentView(email);
  return true;
}

function sentView(email) {
  $('#app').innerHTML = `<div class="login card">${brand()}
  <h3>Revise su correo</h3>
  <p>Enviamos un enlace de acceso a <b>${esc(email)}</b>. Ábralo y pulse el botón para entrar.</p>
  <p class="muted"><small>Si no lo ve en unos minutos, revise la carpeta de spam o de correo no deseado.</small></p>
  <p><button class="sec" id="rs" disabled>Reenviar enlace (60 s)</button> <button class="sec" data-act="again">Usar otro correo</button></p>
  ${helpLine()}</div>`;
  const b = $('#rs'); let n = 60;
  const t = setInterval(() => {
    if (!document.body.contains(b)) return clearInterval(t);
    if (--n > 0) b.textContent = 'Reenviar enlace (' + n + ' s)';
    else { clearInterval(t); b.textContent = 'Reenviar enlace'; b.disabled = false; }
  }, 1000);
  b.onclick = async () => { b.disabled = true; if (!(await sendLink(email))) b.disabled = false; };
}

async function loadBase() {
  const [sp, ft, pf, ad, bd] = await Promise.all([
    sb.from('spaces').select('*, space_features(feature_id, detail, features(name))').order('name'),
    sb.from('features').select('*').order('name'),
    sb.from('profiles').select('*').eq('user_id', S.user.id).maybeSingle(),
    sb.from('admins').select('user_id').eq('user_id', S.user.id).maybeSingle(),
    sb.from('buildings').select('*').order('name')]);
  S.buildings = bd.data || [];
  S.spaces = sp.data || []; S.features = ft.data || []; S.profile = pf.data; S.admin = !!ad.data;
}

async function start(session) {
  S.user = session?.user || null;
  if (!S.user) return loginView();
  await loadBase();
  shell();
}

/* ============ 5. ESTRUCTURA Y PESTAÑAS ============ */
function shell() {
  const tabs = [['new','Nueva solicitud'], ['mine','Mis reservas']];
  if (S.admin) tabs.push(['admin','Administración']);
  $('#app').innerHTML = `<header><h1>${logoSm()}${esc(TITLE)}</h1><span class="muted">${esc(S.user.email)} <button class="sec" data-act="out">Salir</button></span></header>
  <nav>${tabs.map(t => `<button data-act="tab" data-t="${t[0]}" class="${S.tab === t[0] ? 'on' : ''}">${t[1]}</button>`).join('')}</nav><section id="view"></section>`;
  ({new:newView, mine:mineView, admin:adminView})[S.tab]();
}

/* ============ 6. NUEVA SOLICITUD ============ */
function newView() {
  const p = S.profile || {}, ed = S.edit, sd = ed ? loc(ed.starts_at) : '', ee = ed ? loc(ed.ends_at) : '';
  $('#view').innerHTML = `<form id="f" class="card"><h2>${ed ? (ed.status === 'approved' ? 'Editar reserva' : 'Editar solicitud') : 'Nueva solicitud'}</h2>
  <div class="g"><label>Nombre completo<input id="nm" required value="${esc(p.full_name)}"></label>
  <label>Teléfono<input id="ph" required value="${esc(p.phone)}"></label></div>
  <div class="g"><label>Fecha<input type="date" id="dt" required min="${loc(new Date()).slice(0, 10)}" max="${loc(new Date(Date.now() + MAXDAYS * 864e5)).slice(0, 10)}" value="${sd.slice(0, 10)}"></label><label>Hora de inicio<input type="time" id="t1" required value="${sd.slice(11, 16)}"></label>
  <label>Hora de fin<input type="time" id="t2" required value="${ee.slice(11, 16)}"></label><label>Asistentes<input type="number" id="at" min="1" value="${ed?.attendees ?? ''}"></label></div>
  <label>Motivo de la reunión<textarea id="pp" rows="2">${esc(ed?.purpose)}</textarea></label>
  <h3>Salas y recursos</h3><div id="av" class="muted">Elija fecha y horario para ver qué está disponible.</div><br>
  <button>${ed ? 'Guardar cambios' : 'Continuar'}</button>${ed ? ' <button type="button" class="sec" data-act="tab" data-t="mine">Volver sin guardar</button>' : ''}</form>`;
  ['dt','t1','t2'].forEach(i => $('#' + i).onchange = avail);
  $('#f').onsubmit = submit;
  if (ed) avail();
}
function range() {
  const d = $('#dt').value, a = $('#t1').value, b = $('#t2').value;
  if (!d || !a || !b) return [];
  const s = new Date(d + 'T' + a), e = new Date(d + 'T' + b);
  return e > s ? [s.toISOString(), e.toISOString()] : [];
}
// Devuelve {id_espacio: true} para los espacios ocupados en Google Calendar, o null si no se pudo consultar
async function calendarBusy(a, b, rid) {
  try {
    const r = await sb.functions.invoke('check-calendar', {body: {start: a, end: b, reservation_id: rid || undefined}});
    return r.error || !r.data ? null : (r.data.busy || {});
  } catch (_) { return null; }
}
// Solo administradores: lista los eventos de Google Calendar que chocan con la reserva (null si no se pudo consultar)
async function calendarConflicts(rid, a, b, ids) {
  try {
    const r = await sb.functions.invoke('check-calendar', {body: {start: a, end: b, space_ids: ids, reservation_id: rid}});
    if (r.error || !r.data?.conflicts) return null;
    const hm = x => /T/.test(x) ? new Date(x).toLocaleTimeString('es', {hour: '2-digit', minute: '2-digit'}) : 'todo el día';
    return Object.entries(r.data.conflicts).flatMap(([sid, list]) =>
      list.map(x => '• ' + (S.spaces.find(s => s.id === sid)?.name || 'Espacio') + ': ' + x.summary + ' (' + hm(x.start) + ' a ' + hm(x.end) + ')'));
  } catch (_) { return null; }
}
async function avail() {
  const [a, b] = range(), box = $('#av'), ed = S.edit;
  if (!a) { box.textContent = 'Revise que la hora de fin sea posterior a la de inicio.'; return; }
  const editAppr = ed?.status === 'approved', locked = editAppr && ed.space_locked;
  const own = new Set((ed?.reservation_items || []).map(i => i.space_id));
  // Conserva lo que ya estaba marcado (y, al editar, los espacios de la reserva)
  const keep = new Set([...document.querySelectorAll('[name=sp]:checked')].map(x => x.value));
  if (ed && !S.editInit) { S.editInit = 1; own.forEach(id => keep.add(id)); }
  box.textContent = 'Consultando…';
  let act = S.spaces.filter(s => s.active);
  if (locked) act = act.filter(s => own.has(s.id)); // sala asignada por la administración: no se cambia
  // Disponibilidad en la base de datos + lo que ya está en Google Calendar (incluye reservas manuales).
  // Al editar, la propia reserva no cuenta como ocupación.
  const [dbSt, cal] = await Promise.all([
    Promise.all(act.map(s => sb.rpc('check_availability_for', {p_space: s.id, p_start: a, p_end: b, p_exclude: ed?.id ?? null}).then(r => r.data))),
    calendarBusy(a, b, ed?.id)]);
  const st = act.map((s, i) => dbSt[i] === 'available' && cal && cal[s.id] ? 'calendar_busy' : dbSt[i]);
  const warn = cal ? '' : '<p><small>No se pudo consultar Google Calendar: la lista podría no incluir reservas ingresadas a mano.</small></p>';
  const note = locked ? '<p><small>La administración asignó la sala de esta reserva: puede cambiar la fecha y la hora, pero no la sala.</small></p>' : '';
  const keepB = new Set([...document.querySelectorAll('[name=bld]:checked')].map(x => x.value));
  // Edificio completo: todas las salas activas del edificio (no incluye recursos). Solo al crear una solicitud nueva.
  const bRows = ed ? '' : S.buildings.filter(b => b.allow_whole).map(b => {
    const rooms = act.map((s, i) => [s, i]).filter(([s]) => s.kind === 'room' && s.building_id === b.id);
    if (!rooms.length) return '';
    const busy = rooms.filter(([, i]) => st[i] !== 'available').map(([s]) => s.name), free = !busy.length;
    return `<label class="row ${free ? '' : 'off'}"><input type="checkbox" name="bld" value="${b.id}" ${free ? (keepB.has(b.id) ? 'checked' : '') : 'disabled'}>
  <b>${esc(b.name)} completa</b><small>Todas las salas del edificio (no incluye recursos) · Requiere aprobación${free ? '' : ' · Ocupadas: ' + esc(busy.join(', '))}</small>
  <span class="tag ${free ? 'available' : 'booked'}">${free ? 'Disponible' : 'No disponible'}</span></label>`;
  }).join('');
  box.innerHTML = warn + note + bRows + act.map((s, i) => {
    const needs = s.requires_approval !== false;
    const blockedByRule = editAppr && !locked && needs; // al editar una reserva aprobada no se pueden sumar espacios con aprobación
    const off = st[i] !== 'available' || blockedByRule || locked;
    const checked = !blockedByRule && st[i] === 'available' && keep.has(s.id) || (locked && true);
    const tagKey = blockedByRule && st[i] === 'available' ? 'needs' : st[i];
    return `<label class="row ${off && !locked ? 'off' : ''}"><input type="checkbox" name="sp" value="${s.id}" data-b="${s.kind === 'room' ? (s.building_id || '') : ''}" data-off="${off ? 1 : 0}" ${off ? 'disabled' : ''} ${checked ? 'checked' : ''}>
  <b>${esc(s.name)}</b><small>${s.kind === 'room' ? 'Sala' : 'Recurso'}${s.capacity ? ' · ' + s.capacity + ' personas' : ''}${feats(s)} · ${needs ? 'Requiere aprobación' : 'Se aprueba automáticamente'}</small>
  <span class="tag ${tagKey === 'needs' ? 'inactive' : st[i]}">${tagKey === 'needs' ? 'Requiere solicitud nueva' : (LBL[st[i]] || st[i])}</span></label>`;
  }).join('') || 'No hay salas ni recursos habilitados.';
  document.querySelectorAll('[name=bld]').forEach(x => x.onchange = () => syncBld(x));
  syncBld();
}
// Al marcar un edificio completo, sus salas quedan incluidas (se muestran apagadas) y no se eligen una por una
function syncBld(from) {
  if (from?.checked) document.querySelectorAll('[name=bld]').forEach(x => { if (x !== from) x.checked = false; });
  const on = new Set([...document.querySelectorAll('[name=bld]:checked')].map(x => x.value));
  document.querySelectorAll('[name=sp][data-b]').forEach(x => {
    const inc = !!x.dataset.b && on.has(x.dataset.b);
    if (inc) x.checked = false;
    x.disabled = inc || x.dataset.off === '1';
    x.closest('.row').classList.toggle('off', inc || x.dataset.off === '1');
  });
}
async function submit(e) {
  e.preventDefault();
  const [a, b] = range();
  if (!a) return msg('Revise la fecha y las horas.', 1);
  if (new Date(a) > Date.now() + MAXDAYS * 864e5) return msg(ERR.too_far, 1);
  const ids = [...document.querySelectorAll('[name=sp]:checked')].map(x => x.value);
  const bld = S.buildings.find(x => x.id === document.querySelector('[name=bld]:checked')?.value) || null;
  if (!ids.length && !bld) return msg(ERR.no_spaces, 1);
  const ed = S.edit, editAppr = ed?.status === 'approved';
  const rooms = bld ? S.spaces.filter(s => s.active && s.kind === 'room' && s.building_id === bld.id) : [];
  const cal = await calendarBusy(a, b, ed?.id); // revisión final por si alguien reservó mientras tanto
  if (cal && [...ids, ...rooms.map(s => s.id)].some(i => cal[i])) return msg('Alguno de los espacios ya tiene una reserva en ese horario. Vuelva a elegir.', 1);
  const chosen = S.spaces.filter(s => ids.includes(s.id));
  const auto = !bld && chosen.every(s => s.requires_approval === false);
  let q, okTxt, extra = [];
  if (ed) { q = editAppr ? '¿Desea guardar los cambios de la reserva?' : '¿Desea guardar los cambios de la solicitud de reserva?'; okTxt = 'Guardar cambios'; }
  else if (auto) { q = '¿Desea confirmar la reserva?'; okTxt = 'Confirmar reserva'; extra = ['Se aprueba automáticamente.']; }
  else { q = '¿Desea enviar la solicitud de reserva?'; okTxt = 'Enviar solicitud'; extra = [...(bld ? ['Incluye todas las salas de ' + bld.name + '.'] : []), 'Requiere aprobación de la administración.']; }
  const ok = await ask(q, [...(bld ? [bld.name + ' completa'] : []), ...chosen.map(spaceLine), ...when(a, b), ...extra], okTxt, 'Volver');
  if (!ok) return;
  const pf = {user_id: S.user.id, email: S.user.email, full_name: $('#nm').value.trim(), phone: $('#ph').value.trim(), updated_at: new Date().toISOString()};
  let r = await sb.from('profiles').upsert(pf);
  if (r.error) return msg(err(r.error), 1);
  S.profile = pf;
  const f = {p_purpose: $('#pp').value, p_attendees: +$('#at').value || null, p_start: a, p_end: b, p_space_ids: ids};
  let text;
  if (editAppr) {
    // Reserva aprobada: se revalida en base de datos y Calendar; si no se puede, se conserva la original
    r = await sb.functions.invoke('reserve', {body: {action: 'edit', reservation_id: ed.id, purpose: f.p_purpose, attendees: f.p_attendees, start: a, end: b, space_ids: ids}});
    const out = r.data;
    if (r.error || !out) return msg('No se pudo guardar el cambio. Se conservó la reserva original.', 1);
    if (!out.ok) return msg(err({message: out.error || ''}) || 'No se pudo guardar el cambio. Se conservó la reserva original.', 1);
    sb.functions.invoke('notify', {body: {reservation_id: ed.id, event: 'edited'}}).catch(() => {});
    text = out.calendar_ok ? 'Reserva actualizada y registrada en el calendario.' : 'Reserva actualizada. El calendario podría tardar en reflejarlo; la administración puede revisarlo.';
  } else {
    const isNew = !ed;
    if (ed) {
      r = await sb.rpc('update_my_reservation', {p_reservation: ed.id, ...f});
      if (r.error) return msg(err(r.error), 1);
    } else {
      r = await sb.rpc('submit_reservation', {...f, p_building: bld?.id ?? null});
      if (r.error) return msg(err(r.error), 1);
    }
    const rid = ed ? ed.id : r.data;
    let approved = false, reason = '';
    if (auto) {
      try {
        const x = await sb.functions.invoke('reserve', {body: {action: 'auto_approve', reservation_id: rid}});
        approved = !!x.data?.approved; reason = x.data?.reason || (x.error ? 'calendar_error' : '');
      } catch (_) { reason = 'calendar_error'; }
    }
    if (approved) {
      sb.functions.invoke('notify', {body: {reservation_id: rid, event: 'auto'}}).catch(() => {});
      text = 'Reserva confirmada. Quedó aprobada y registrada en el calendario.';
    } else {
      sb.functions.invoke('notify', {body: {reservation_id: rid, event: isNew ? 'new' : 'edited'}}).catch(() => {});
      if (auto && reason === 'calendar_conflict') text = 'Ese horario ya tiene una reserva en el calendario. Su solicitud quedó pendiente de revisión.';
      else if (auto && reason !== 'not_pending') text = 'No se pudo confirmar automáticamente. Su solicitud quedó pendiente de revisión.';
      else text = isNew ? 'Solicitud enviada. Queda pendiente de revisión.' : 'Solicitud actualizada. Sigue pendiente de revisión.';
    }
  }
  msg(text);
  S.edit = null; S.tab = 'mine'; shell();
}

async function mineView() {
  const wasOpen = document.querySelector('#view details.hist')?.open; // para no plegar el historial al refrescar
  $('#view').textContent = 'Cargando…';
  const since = new Date(Date.now() - 30 * 864e5).toISOString(); // historial: últimos 30 días
  const {data, error} = await sb.from('reservations').select('*, reservation_items(space_id, spaces(name, kind, building_id, requires_approval))').eq('requester_id', S.user.id).gte('ends_at', since).order('starts_at', {ascending: false});
  if (error) return msg(err(error), 1);
  S.mine = Object.fromEntries((data || []).map(r => [r.id, r]));
  // Editar: solicitudes pendientes siempre; reservas aprobadas solo con 24 h o más de anticipación y si todos sus espacios son de aprobación automática
  const actions = r => {
    const cancel = '<button class="sec" data-act="cx" data-id="' + r.id + '">Cancelar reserva</button>';
    if (r.whole_building_id) return '<div>' + cancel + '</div><small class="muted">' + (r.status === 'pending' ? 'Las solicitudes de edificio completo no se editan: cancele y haga una nueva, o comuníquese con la administración.' : 'Para cambiar esta reserva, comuníquese con la administración o cancélela.') + '</small>';
    if (r.status === 'pending') return '<div><button data-act="em" data-id="' + r.id + '">Editar solicitud</button> ' + cancel + '</div>';
    const auto = (r.reservation_items || []).every(i => i.spaces?.requires_approval === false);
    if (new Date(r.starts_at) - Date.now() < 24 * 36e5) return '<div>' + cancel + '</div><small class="muted">Faltan menos de 24 horas: solo puede cancelar.</small>';
    if (!auto) return '<div>' + cancel + '</div><small class="muted">Para cambiar esta reserva, comuníquese con la administración o cancélela.</small>';
    return '<div><button data-act="em" data-id="' + r.id + '">Editar reserva</button> ' + cancel + '</div>';
  };
  const card = r => `<div class="card"><span class="tag ${r.status}">${LBL[r.status]}</span>
  <h3>${esc(names(r))}</h3><div>${rango(r)}</div>
  ${r.was_modified ? '<small>La administración ajustó el horario o los datos solicitados.</small><br>' : ''}
  ${r.admin_note ? '<small>Nota: ' + esc(r.admin_note) + '</small>' : ''}
  ${['pending', 'approved'].includes(r.status) && new Date(r.ends_at) > new Date() ? actions(r) : ''}</div>`;
  // Arriba: próximas y pendientes (la más cercana primero). Abajo: historial plegado (la más reciente primero).
  const all = data || [], now = new Date();
  const active = all.filter(r => ['pending', 'approved'].includes(r.status) && new Date(r.ends_at) > now)
    .sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const hist = all.filter(r => !active.includes(r));
  const line = r => {
    const st = r.status === 'pending' ? 'expired' : r.status; // pendiente cuya fecha ya pasó = sin respuesta
    return `<div class="row"><b>${esc(names(r))}</b><small>${rango(r)}</small>${r.admin_note ? '<small>· Nota: ' + esc(r.admin_note) + '</small>' : ''}<span class="tag ${st}">${LBL[st]}</span></div>`;
  };
  if (!all.length) { $('#view').innerHTML = '<p class="muted">Aún no tiene solicitudes. Cree la primera en "Nueva solicitud".</p>'; return; }
  $('#view').innerHTML = '<h2>Próximas y pendientes' + (active.length ? ' (' + active.length + ')' : '') + '</h2>' +
    (active.map(card).join('') || '<p class="muted">No tiene reservas próximas ni pendientes.</p>') +
    (hist.length ? `<details class="hist" ${wasOpen ? 'open' : ''}><summary>Historial (últimos 30 días) · ${hist.length}</summary><div class="card">${hist.map(line).join('')}</div></details>` : '');
}

async function decide(btn, kind) {
  const card = btn.closest('.card'), id = card.dataset.id, r = S.res[id];
  const s = iso(card.querySelector('.s').value), e = iso(card.querySelector('.e').value);
  let removed = [], swapped = false;
  if (kind === 'ok') {
    const sel = [...card.querySelectorAll('details input:checked')].map(x => x.value);
    const cur = r.reservation_items.map(i => i.space_id);
    swapped = !(sel.length === cur.length && sel.every(x => cur.includes(x)));
    // Revisa Google Calendar antes de aprobar: si hay eventos en ese horario, el administrador decide
    const found = await calendarConflicts(id, s, e, sel.length ? sel : cur);
    if (found && found.length && !(await ask('En Google Calendar ya hay eventos en ese horario. ¿Desea aprobar de todos modos?', found, 'Aprobar de todos modos', 'Volver'))) return;
    if (swapped) {
      const q = await sb.rpc('change_reservation_spaces', {p_reservation: id, p_space_ids: sel});
      if (q.error) return msg(err(q.error), 1);
      removed = q.data || [];
    }
  }
  const up = {admin_note: card.querySelector('.n').value || null, decided_by: S.user.id, decided_at: new Date().toISOString()};
  if (kind === 'ok') {
    const changed = new Date(s) - new Date(r.starts_at) || new Date(e) - new Date(r.ends_at);
    Object.assign(up, {status: 'approved', starts_at: s, ends_at: e, was_modified: r.was_modified || !!changed || (swapped && !r.whole_building_id)});
  } else up.status = r.status === 'pending' ? 'rejected' : 'cancelled';
  const {error} = await sb.from('reservations').update(up).eq('id', id);
  if (error) return msg(err(error), 1);
  const f = await sb.functions.invoke('sync-calendar', {body: {reservation_id: id, removed}});
  let d = '';
  try { const j = f.error ? await f.error.context.json() : f.data; d = (j.detail || [j.error]).filter(Boolean).join('; '); } catch (_) {}
  const n = await sb.functions.invoke('notify', {body: {reservation_id: id, event: 'decision'}});
  const mail = n.error ? ' No se pudo enviar el correo a la persona.' : ' Se avisó por correo a la persona.';
  msg((f.error ? 'Guardado, pero Google Calendar no se actualizó: ' + d : 'Listo. ' + d) + mail, !!f.error || !!n.error);
  adminView();
}

const acts = {
  google: () => sb.auth.signInWithOAuth({provider: 'google', options: {redirectTo: location.origin + location.pathname}}),
  out: () => sb.auth.signOut(),
  again: () => loginView(),
  tab: b => { S.tab = b.dataset.t; S.edit = null; shell(); },
  em: b => { S.edit = S.mine[b.dataset.id]; S.editInit = 0; S.tab = 'new'; shell(); },
  eb: b => editBuilding(b.dataset.id),
  bx: async b => {
    const x = S.buildings.find(y => y.id === b.dataset.id);
    if (!await ask('¿Desea eliminar el edificio?', [x?.name || ''], 'Eliminar', 'Volver')) return;
    const r = await sb.from('buildings').delete().eq('id', b.dataset.id);
    if (r.error) return msg(err(r.error), 1);
    await loadBase(); msg('Edificio eliminado.'); adminView();
  },
  ok: b => decide(b, 'ok'),
  no: b => decide(b, 'no'),
  ed: b => editSpace(b.dataset.id),
  cx: async b => {
    const id = b.dataset.id;
    const m = S.mine[id];
    const ok = await ask('¿Desea cancelar la reserva?',
      [...m.reservation_items.map(i => spaceLine(S.spaces.find(s => s.id === i.space_id))), ...when(m.starts_at, m.ends_at), 'El espacio quedará libre para otras personas.'],
      'Sí, cancelar reserva', 'Volver');
    if (!ok) return;
    const q = await sb.rpc('cancel_my_reservation', {p_reservation: id});
    if (q.error) return msg(err(q.error), 1);
    const f = await sb.functions.invoke('sync-calendar', {body: {reservation_id: id}}); // quita el evento del calendario
    sb.functions.invoke('notify', {body: {reservation_id: id, event: 'cancelled'}}).catch(() => {}); // avisa a la administración
    msg(f.error ? 'Reserva cancelada. Avise a la administración para que quite el evento del calendario.' : 'Reserva cancelada. El espacio quedó libre.', !!f.error);
    mineView();
  },
  bo: async () => {
    const s = $('#bs').value, a = $('#b1').value, b = $('#b2').value;
    if (!s || !a || !b) return msg('Complete el espacio y las fechas.', 1);
    const {error} = await sb.from('blackouts').insert({space_id: s, starts_at: iso(a), ends_at: iso(b), reason: $('#br').value || null});
    error ? msg(err(error), 1) : adminView();
  },
  bd: async b => { await sb.from('blackouts').delete().eq('id', b.dataset.id); adminView(); }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) acts[b.dataset.act]?.(b); });
</script>
</body>
</html>
